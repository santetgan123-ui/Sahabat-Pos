<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Sahabat Pos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mountain-dark': '#0f172a',
                        'sunset-orange': '#ea580c',
                        'sand': '#f5f5f4',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-mountain-dark text-sand font-sans min-h-screen">

    <!-- Navbar Simple -->
    <div class="fixed top-0 left-0 right-0 z-50 p-6 flex justify-between items-start pointer-events-none">
        <a href="index.html" class="pointer-events-auto flex items-center gap-2 bg-black/50 backdrop-blur px-4 py-2 rounded-full border border-gray-700 hover:bg-sunset-orange hover:border-sunset-orange transition-all">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span class="text-sm font-bold">Kembali</span>
        </a>

        <button onclick="toggleAdminModal()" class="pointer-events-auto bg-black/50 backdrop-blur p-2 rounded-full border border-gray-700 hover:text-sunset-orange transition-all">
            <i data-lucide="lock" class="w-4 h-4"></i>
        </button>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-20">
        <div class="text-center mb-12">
            <h1 class="font-serif text-4xl md:text-5xl font-bold mb-4">Jejak Langkah Kami</h1>
            <p class="text-gray-400 max-w-2xl mx-auto">Setiap puncak memiliki cerita.</p>
            
            <!-- Tombol Tambah (Hanya Muncul Jika Admin Login) -->
            <div id="admin-controls" class="hidden mt-6">
                <button onclick="openUploadModal()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-full font-bold flex items-center gap-2 mx-auto shadow-lg shadow-green-900/50 transition-all">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i> Tambah Foto Baru
                </button>
                <p class="text-green-500 text-xs mt-2 font-mono">Status: Administrator Active</p>
            </div>
        </div>

        <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Item galeri via JS -->
        </div>

        <div class="mt-12 text-center">
            <p class="text-gray-500 text-sm">© Sahabat Pos Gallery System</p>
        </div>
    </div>

    <!-- MODAL LOGIN ADMIN -->
    <div id="login-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-700 p-8 rounded-2xl w-full max-w-md mx-4 shadow-2xl">
            <h3 class="font-serif text-2xl font-bold text-white mb-6 flex items-center gap-2">
                <i data-lucide="shield-check" class="text-sunset-orange"></i> Admin Login
            </h3>
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-400 text-sm mb-2">Username</label>
                    <input type="text" id="admin-user" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-sunset-orange" placeholder="Masukkan username" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-400 text-sm mb-2">Password</label>
                    <input type="password" id="admin-pass" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-sunset-orange" placeholder="Masukkan password" required>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="document.getElementById('login-modal').style.display='none'" class="text-gray-400 hover:text-white px-4 py-2">Batal</button>
                    <button type="submit" class="bg-sunset-orange hover:bg-orange-700 text-white px-6 py-2 rounded-lg font-bold">Masuk</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL UPLOAD FOTO (INPUT FILE SIMPEL) -->
    <div id="upload-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-700 p-8 rounded-2xl w-full max-w-lg mx-4 shadow-2xl">
            <h3 class="font-serif text-2xl font-bold text-white mb-6">Upload Kenangan Baru</h3>
            <form onsubmit="handleUpload(event)">
                
                <!-- INPUT FILE -->
                <div class="mb-4">
                    <label class="block text-gray-400 text-sm mb-2">Pilih File dari Perangkat</label>
                    <input type="file" id="img-file" accept="image/*" required 
                           class="block w-full text-sm text-gray-300
                                  file:mr-4 file:py-2 file:px-4
                                  file:rounded-full file:border-0
                                  file:text-sm file:font-semibold
                                  file:bg-sunset-orange file:text-white
                                  hover:file:bg-orange-600
                                  cursor-pointer bg-gray-800 rounded-lg border border-gray-700">
                    <p class="text-xs text-gray-500 mt-2">*Mendukung: JPG, PNG, WEBP (Max 5MB)</p>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-400 text-sm mb-2">Nama Gunung / Lokasi</label>
                    <input type="text" id="img-title" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-sunset-orange" placeholder="Contoh: Gunung Prau">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-400 text-sm mb-2">Ketinggian / Lokasi</label>
                    <input type="text" id="img-desc" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-sunset-orange" placeholder="Contoh: 2.565 MDPL - Jawa Tengah">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="document.getElementById('upload-modal').style.display='none'" class="text-gray-400 hover:text-white px-4 py-2">Batal</button>
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-bold">Upload Foto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- UPDATE: Menambahkan ?v=2 agar browser tidak memuat file lama dari cache -->
    <script src="script.js?v=2"></script>
</body>
</html>
